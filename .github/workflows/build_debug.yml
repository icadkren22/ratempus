name: Build Debug Artifacts

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 28.0.12674087
        run: sdkmanager "ndk;28.0.12674087"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Tempus arm64 Debug APK
        run: |
          sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle
          ./gradlew assembleTempusDebug

      - name: Upload Tempus Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ratempus-debug-apk
          path: app/build/outputs/apk/tempus/debug/*.apk
          if-no-files-found: error
          retention-days: 7
