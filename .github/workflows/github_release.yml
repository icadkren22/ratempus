name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-dev') }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 28.0.12674087
        run: sdkmanager "ndk;28.0.12674087"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APKs
        run: |
          sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle
          ./gradlew assembleTempusRelease assembleDegoogledRelease

      - name: Sign Tempus Release APKs
        id: sign_tempus
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/tempus/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS_GITHUB }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD_GITHUB }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Sign Degoogled Release APKs
        id: sign_degoogled
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/degoogled/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS_GITHUB }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD_GITHUB }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Rename Signed APKs
        run: |
          for file in app/build/outputs/apk/tempus/release/*-signed.apk; do
            mv "$file" "$(echo "$file" | sed 's/-unsigned-signed\.apk$/.apk/' | sed 's/-signed\.apk$/.apk/')"
          done
          for file in app/build/outputs/apk/degoogled/release/*-signed.apk; do
            mv "$file" "$(echo "$file" | sed 's/-unsigned-signed\.apk$/.apk/' | sed 's/-signed\.apk$/.apk/')"
          done

      - name: Compress Mapping Files
        run: |
          mv app/build/outputs/mapping/tempusRelease/mapping.txt \
             app/build/outputs/mapping/tempusRelease/mapping_Tempus.txt
          mv app/build/outputs/mapping/degoogledRelease/mapping.txt \
             app/build/outputs/mapping/degoogledRelease/mapping_Degoogled.txt
          gzip app/build/outputs/mapping/tempusRelease/mapping_Tempus.txt
          gzip app/build/outputs/mapping/degoogledRelease/mapping_Degoogled.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          prerelease: false
          files: |
            app/build/outputs/apk/tempus/release/*-release.apk
            app/build/outputs/apk/degoogled/release/*-release.apk
            app/build/outputs/mapping/tempusRelease/mapping_Tempus.txt.gz
            app/build/outputs/mapping/degoogledRelease/mapping_Degoogled.txt.gz
